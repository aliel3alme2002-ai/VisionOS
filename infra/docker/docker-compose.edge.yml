version: '3.8'

networks:
  backend:
    driver: bridge
  database:
    driver: bridge
  edge:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  frigate-media:
  frigate-config:

services:
  postgres:
    image: postgres:16-alpine
    container_name: visionos-postgres-edge
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visionos_edge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edge_box_secure_password_replace_me}
      POSTGRES_DB: ${POSTGRES_DB:-visionos_edge}
    ports:
      - "5432:5432"
    networks:
      - database
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-visionos_edge} -d $${POSTGRES_DB:-visionos_edge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: visionos-redis-edge
    restart: always
    ports:
      - "6379:6379"
    networks:
      - database
      - backend
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: visionos-mosquitto-edge
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - edge
      - backend
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: visionos-frigate-edge
    restart: always
    shm_size: "1gb"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - "5000:5000"
      - "8554:8554"
      - "8555:8555"
    networks:
      - edge
      - backend
    volumes:
      - frigate-config:/config
      - frigate-media:/media/frigate
      - ../frigate-config/config.yml:/config/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
