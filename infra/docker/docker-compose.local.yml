version: '3.8'

networks:
  backend:
    driver: bridge
  database:
    driver: bridge
  edge:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  frigate-media:
  frigate-config:

services:
  postgres:
    image: postgres:16-alpine
    container_name: visionos-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visionos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionos_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-visionos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - database
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-visionos} -d $${POSTGRES_DB:-visionos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: visionos-redis-local
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - database
      - backend
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: visionos-mosquitto-local
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    networks:
      - edge
      - backend
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: visionos-frigate-local
    restart: unless-stopped
    shm_size: "64mb"
    ports:
      - "${FRIGATE_PORT:-5000}:5000"
      - "${FRIGATE_RTSP_PORT:-8554}:8554"
      - "${FRIGATE_WEBRTC_PORT:-8555}:8555"
    networks:
      - edge
      - backend
    volumes:
      - frigate-config:/config
      - frigate-media:/media/frigate
      - ../frigate-config/config.yml:/config/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
